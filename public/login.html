<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — MI-BICI</title>
  <link rel="stylesheet" href="/css/mibici.css" />
  <style>
    /* Estilos propios de la pantalla de acceso */
    .acceso {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    .acceso .caja { width: 100%; max-width: 420px; }
    .acceso .encabezado { text-align: center; margin-bottom: 22px; }
    .acceso .encabezado .punto {
      width: 54px; height: 54px; border-radius: 16px;
      background: var(--verde); color: #fff;
      display: grid; place-items: center;
      font-size: 1.7rem; margin: 0 auto 12px;
    }
    .acceso h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; }
    .acceso .encabezado p { margin: 4px 0 0; color: var(--texto-suave); font-size: .95rem; }
    .enlace-pruebas { text-align: center; margin-top: 18px; font-size: .85rem; }
  </style>
</head>
<body>
  <main class="acceso">
    <div class="caja">
      <div class="encabezado">
        <div class="punto">&#128690;</div>
        <h1>MI-BICI</h1>
        <p>Movilidad segura en bicicleta para Bogotá</p>
      </div>

      <div class="panel">
        <!-- Selector entre iniciar sesión y crear cuenta -->
        <div class="pestanas">
          <button type="button" id="btnTabLogin" class="activa">Iniciar sesión</button>
          <button type="button" id="btnTabRegistro">Crear cuenta</button>
        </div>

        <!-- Formulario de inicio de sesión -->
        <form id="formLogin">
          <label for="logUsuario">Usuario</label>
          <input id="logUsuario" name="usuario" required autocomplete="username" />

          <label for="logContrasena">Contraseña</label>
          <input id="logContrasena" name="contrasena" type="password" required autocomplete="current-password" />

          <button type="submit" class="boton ancho" style="margin-top:20px">Entrar</button>
        </form>

        <!-- Formulario de registro -->
        <form id="formRegistro" hidden>
          <label for="regUsuario">Usuario</label>
          <input id="regUsuario" name="usuario" required autocomplete="username" />
          <p class="ayuda">Mínimo 4 caracteres.</p>

          <label for="regCorreo">Correo (opcional)</label>
          <input id="regCorreo" name="correo" type="email" autocomplete="email" />

          <label for="regContrasena">Contraseña</label>
          <input id="regContrasena" name="contrasena" type="password" required autocomplete="new-password" />
          <p class="ayuda">Mínimo 6 caracteres.</p>

          <button type="submit" class="boton ancho" style="margin-top:20px">Crear cuenta</button>
        </form>

        <p class="mensaje" id="mensaje"></p>
      </div>

      <p class="enlace-pruebas"><a href="/pruebas">Ver el panel de pruebas de la API</a></p>
    </div>
  </main>

  <script src="/js/sesion.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
